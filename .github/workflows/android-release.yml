name: Android Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate and decode private signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ "$name" = "ANDROID_KEYSTORE_BASE64" ]; then
              value="$ANDROID_KEYSTORE_BASE64"
            else
              value="${!name:-}"
            fi
            if [ -z "$value" ]; then
              echo "::error::Required GitHub Actions secret $name is missing. Create and protect your own release keystore first."
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/yasser-security-lab-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "ANDROID_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
          chmod 600 "$keyfile"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::Release APK is marked debuggable."
            exit 1
          fi
          sha256sum "$apk" | tee app-release-sha256.txt

      - name: Upload verified signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release-sha256.txt
          if-no-files-found: error
