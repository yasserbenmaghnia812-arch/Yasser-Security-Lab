name: Authorized Static Security Analysis
run-name: API job ${{ inputs.job_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: API job identifier used to associate the workflow run with its database record
        required: false
        type: string
      confirm_owned_files:
        description: "Confirm all files in this repository are yours or authorized for analysis"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "supabase/**"
      - "index.html"
      - "render.yaml"
      - ".gitleaks.toml"
      - "security/**"
      - ".github/workflows/security-static.yml"

permissions:
  contents: read
  security-events: write

jobs:
  source-analysis:
    if: github.event_name == 'push' || inputs.confirm_owned_files == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep and Checkov
        run: python -m pip install --disable-pip-version-check semgrep checkov
      - name: Semgrep source analysis
        run: |
          semgrep scan --config auto --json --output semgrep.json api app supabase || true
      - name: Checkov infrastructure analysis
        run: |
          checkov -d . --framework github_actions,terraform,kubernetes,dockerfile,helm,secrets --output json > checkov.json || true
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --format json --output trivy.json --severity HIGH,CRITICAL --exit-code 0 .
      - name: Install Syft and Grype
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.cdx.json
      - name: Install Grype
        uses: anchore/scan-action/download-grype@v5
      - name: Add Grype to PATH
        shell: bash
        run: |
          GRYPE_BIN="$(find /opt/hostedtoolcache/grype -type f -name grype -perm -111 -print -quit)"
          if [ -z "$GRYPE_BIN" ]; then
            echo "Grype executable not found after installer step."
            exit 2
          fi
          echo "$(dirname "$GRYPE_BIN")" >> "$GITHUB_PATH"
          "$GRYPE_BIN" version
      - name: Scan SBOM dependencies
        shell: bash
        run: |
          grype sbom:sbom.cdx.json -o json > grype.json
          python -m json.tool grype.json > /dev/null
      - name: Install YARA and ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y yara clamav
      - name: YARA repository scan
        shell: bash
        run: |
          set +e
          : > yara.txt
          scanned=0
          matches=0
          errors=0
          tmp_out="$(mktemp)"
          tmp_err="$(mktemp)"
          # Validate that the rules compile before scanning repository files.
          yara security/yara/secrets.yar /dev/null > "$tmp_out" 2> "$tmp_err"
          compile_status=$?
          if [ "$compile_status" -ne 0 ] || [ -s "$tmp_err" ]; then
            cat "$tmp_err"
            echo "YARA rules failed validation."
            exit 2
          fi
          while IFS= read -r -d '' file; do
            : > "$tmp_out"
            : > "$tmp_err"
            yara security/yara/secrets.yar "$file" > "$tmp_out" 2> "$tmp_err"
            result=$?
            output="$(cat "$tmp_out")"
            error_output="$(cat "$tmp_err")"
            scanned=$((scanned + 1))
            if [ "$result" -ne 0 ] || [ -n "$error_output" ]; then
              printf 'ERROR scanning %s: %s\n' "$file" "$error_output" >> yara.txt
              errors=$((errors + 1))
            elif [ -n "$output" ]; then
              printf '%s\n' "$output" >> yara.txt
              matches=$((matches + 1))
            fi
          done < <(find . -type f ! -path './.git/*' ! -path './security/yara/*' -print0)
          rm -f "$tmp_out" "$tmp_err"
          printf '\nScanned files: %s\nFiles with YARA matches: %s\nScanner errors: %s\n' "$scanned" "$matches" "$errors" >> yara.txt
          cat yara.txt
          if [ "$errors" -gt 0 ]; then exit 2; fi
          if [ "$matches" -gt 0 ]; then exit 1; fi
      - name: ClamAV repository scan
        shell: bash
        run: |
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout --verbose > freshclam-update.txt 2>&1
          database_count="$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) | wc -l)"
          if [ "$database_count" -eq 0 ]; then
            cat freshclam-update.txt
            echo "ClamAV signature database was not downloaded."
            exit 2
          fi
          set +e
          # Redirect from the unprivileged shell so the report remains readable/uploadable.
          sudo clamscan -r --infected --exclude-dir='^./\.git' . > clamav.txt 2>&1
          scan_status=$?
          set -e
          cat clamav.txt
          if [ "$scan_status" -eq 2 ]; then exit 2; fi
          if [ "$scan_status" -eq 1 ]; then exit 1; fi
      - name: Upload source-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-source-reports
          path: |
            semgrep.json
            checkov.json
            trivy.json
            sbom.cdx.json
            grype.json
            yara.txt
            freshclam-update.txt
            clamav.txt
          if-no-files-found: warn

  apk-static-analysis:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_owned_files == true) ||
      (github.event_name == 'push' && (
        contains(join(github.event.head_commit.modified, ','), 'app/') ||
        contains(join(github.event.head_commit.added, ','), 'app/') ||
        contains(join(github.event.head_commit.modified, ','), 'authorized-samples/') ||
        contains(join(github.event.head_commit.added, ','), 'authorized-samples/') ||
        contains(join(github.event.head_commit.removed, ','), 'authorized-samples/') ||
        contains(join(github.event.head_commit.modified, ','), '.github/workflows/security-static.yml')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Find authorized APK samples
        id: samples
        shell: bash
        run: |
          mkdir -p reports
          find authorized-samples -type f -iname '*.apk' -print 2>/dev/null > reports/apk-files.txt || true
          if [ -s reports/apk-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "build_self=false" >> "$GITHUB_OUTPUT"
          elif [ -f app/build.gradle.kts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "build_self=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "build_self=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java for project APK build
        if: steps.samples.outputs.build_self == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle for project APK build
        if: steps.samples.outputs.build_self == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK for project APK build
        if: steps.samples.outputs.build_self == 'true'
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Build this repository APK as an authorized analysis sample
        if: steps.samples.outputs.build_self == 'true'
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleDebug
          echo "app/build/outputs/apk/debug/app-debug.apk" >> reports/apk-files.txt
      - name: Install APK and binary-analysis tools
        if: steps.samples.outputs.found == 'true'
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install APK and binary-analysis packages
        if: steps.samples.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip curl git build-essential pkg-config libssl-dev liblz4-dev libzip-dev libcapstone-dev
          python -m pip install --disable-pip-version-check "cryptography>=45.0.7,<47" androguard apkleaks
          mkdir -p "$HOME/tools"
          python - <<'PY'
          import json, os, re, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/skylot/jadx/releases/latest",
              headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          asset = next((x for x in release["assets"] if re.fullmatch(r"jadx-\d+\.\d+\.\d+\.zip", x["name"])), None)
          if not asset:
              raise SystemExit("No standard JADX release ZIP found.")
          urllib.request.urlretrieve(asset["browser_download_url"], os.path.expanduser("~/tools/jadx.zip"))
          PY
          unzip -q "$HOME/tools/jadx.zip" -d "$HOME/tools/jadx"
          git clone --depth 1 https://github.com/radareorg/radare2 "$HOME/tools/radare2"
          (cd "$HOME/tools/radare2" && sys/install.sh) || echo "radare2 build did not complete; other analyzers will continue"
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest",
              headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          asset = next((x for x in release["assets"] if x["name"].lower().endswith(".zip") and "public" in x["name"].lower()), None)
          if not asset:
              raise SystemExit("No public Ghidra release ZIP found.")
          urllib.request.urlretrieve(asset["browser_download_url"], os.path.expanduser("~/tools/ghidra.zip"))
          PY
          unzip -q "$HOME/tools/ghidra.zip" -d "$HOME/tools/ghidra"
          GHIDRA_HOME="$(find "$HOME/tools/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Start MobSF API-only container
        if: steps.samples.outputs.found == 'true'
        run: |
          key="$(openssl rand -hex 32)"
          echo "MOBSF_API_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" -e MOBSF_API_ONLY=1 opensecurity/mobile-security-framework-mobsf:latest
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Authorization: $key" http://127.0.0.1:8000/api/v1/scans -o /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs mobsf
          exit 1
      - name: Analyze authorized APK files
        if: steps.samples.outputs.found == 'true'
        shell: bash
        run: |
          set +e
          while IFS= read -r apk; do
            base="$(basename "$apk" .apk)"
            mkdir -p "reports/$base"
            apktool d -f "$apk" -o "reports/$base/resources"
            "$HOME/tools/jadx/bin/jadx" -d "reports/$base/source" "$apk"
            apkleaks -f "$apk" -o "reports/$base/apkleaks.txt"
            curl -fsS -F "file=@$apk" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/upload > "reports/$base/mobsf-upload.json"
            scan_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["hash"])' "reports/$base/mobsf-upload.json")"
            curl -fsS -X POST --data-urlencode "hash=$scan_hash" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/scan > "reports/$base/mobsf-scan.json"
            curl -fsS -X POST --data-urlencode "hash=$scan_hash" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/report_json > "reports/$base/mobsf-report.json"
            mkdir -p "reports/$base/native"
            unzip -oq "$apk" 'lib/*/*.so' -d "reports/$base/native" || true
            while IFS= read -r native; do
              [ -n "$native" ] || continue
              name="$(basename "$native")"
              if command -v rabin2 >/dev/null 2>&1; then rabin2 -I "$native" > "reports/$base/$name.radare2.txt" 2>&1 || true; fi
              if [ -x "$GHIDRA_HOME/support/analyzeHeadless" ]; then
                "$GHIDRA_HOME/support/analyzeHeadless" "reports/$base/ghidra-project" "$name" -import "$native" -max-cpu 2 -analysisTimeoutPerFile 300 > "reports/$base/$name.ghidra.txt" 2>&1 || true
              fi
            done < <(find "reports/$base/native" -type f -name '*.so' -print)
            python - "$apk" "reports/$base/androguard.txt" <<'PY'
          import sys
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK(sys.argv[1])
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("Package: " + str(a.get_package()) + "\n")
              f.write("Permissions:\n" + "\n".join(a.get_permissions()) + "\n")
              f.write("Activities:\n" + "\n".join(a.get_activities()) + "\n")
          PY
          done < reports/apk-files.txt
      - name: Upload APK analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-apk-reports
          path: reports/
          if-no-files-found: warn
