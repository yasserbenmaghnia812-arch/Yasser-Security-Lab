name: Authorized Static Security Analysis
run-name: API job ${{ inputs.job_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: API job identifier used to associate the workflow run with its database record
        required: false
        type: string
      confirm_owned_files:
        description: "Confirm all files in this repository are yours or authorized for analysis"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "supabase/**"
      - ".github/workflows/security-static.yml"

permissions:
  contents: read
  security-events: write

jobs:
  source-analysis:
    if: github.event_name == 'push' || inputs.confirm_owned_files == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep and Checkov
        run: python -m pip install --disable-pip-version-check semgrep checkov
      - name: Semgrep source analysis
        run: |
          semgrep scan --config auto --json --output semgrep.json api app supabase || true
      - name: Checkov infrastructure analysis
        run: |
          checkov -d . --framework github_actions,terraform,kubernetes,dockerfile,helm,secrets --output json > checkov.json || true
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --format json --output trivy.json --severity HIGH,CRITICAL --exit-code 0 .
      - name: Install Syft and Grype
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json=sbom.cdx.json
      - name: Install Grype
        uses: anchore/scan-action/download-grype@v5
      - name: Scan SBOM dependencies
        run: grype sbom:sbom.cdx.json -o json > grype.json || true
      - name: Install YARA and ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y yara clamav
      - name: YARA repository scan
        run: yara -r /usr/share/yara/rules/index.yar . > yara.txt 2>&1 || true
      - name: ClamAV repository scan
        run: |
          sudo freshclam || true
          clamscan -r --infected --log=clamav.txt . || true
      - name: Upload source-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-source-reports
          path: |
            semgrep.json
            checkov.json
            trivy.json
            sbom.cdx.json
            grype.json
            yara.txt
            clamav.txt
          if-no-files-found: warn

  apk-static-analysis:
    if: github.event_name == 'push' || inputs.confirm_owned_files == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find authorized APK samples
        id: samples
        shell: bash
        run: |
          mkdir -p reports
          find authorized-samples -type f -iname '*.apk' -print 2>/dev/null > reports/apk-files.txt || true
          if [ -s reports/apk-files.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install APK and binary-analysis tools
        if: steps.samples.outputs.found == 'true'
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install APK and binary-analysis packages
        if: steps.samples.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip curl git build-essential pkg-config libssl-dev liblz4-dev libzip-dev libcapstone-dev
          python -m pip install --disable-pip-version-check androguard apkleaks
          mkdir -p "$HOME/tools"
          curl -fsSL https://github.com/skylot/jadx/releases/latest/download/jadx-1.5.1.zip -o "$HOME/tools/jadx.zip"
          unzip -q "$HOME/tools/jadx.zip" -d "$HOME/tools/jadx"
          git clone --depth 1 https://github.com/radareorg/radare2 "$HOME/tools/radare2"
          (cd "$HOME/tools/radare2" && sys/install.sh) || echo "radare2 build did not complete; other analyzers will continue"
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest",
              headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          asset = next((x for x in release["assets"] if x["name"].lower().endswith(".zip") and "public" in x["name"].lower()), None)
          if not asset:
              raise SystemExit("No public Ghidra release ZIP found.")
          urllib.request.urlretrieve(asset["browser_download_url"], os.path.expanduser("~/tools/ghidra.zip"))
          PY
          unzip -q "$HOME/tools/ghidra.zip" -d "$HOME/tools/ghidra"
          GHIDRA_HOME="$(find "$HOME/tools/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Start MobSF API-only container
        if: steps.samples.outputs.found == 'true'
        run: |
          key="$(openssl rand -hex 32)"
          echo "MOBSF_API_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" -e MOBSF_API_ONLY=1 opensecurity/mobile-security-framework-mobsf:latest
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Authorization: $key" http://127.0.0.1:8000/api/v1/scans -o /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs mobsf
          exit 1
      - name: Analyze authorized APK files
        if: steps.samples.outputs.found == 'true'
        shell: bash
        run: |
          set +e
          while IFS= read -r apk; do
            base="$(basename "$apk" .apk)"
            mkdir -p "reports/$base"
            apktool d -f "$apk" -o "reports/$base/resources"
            "$HOME/tools/jadx/bin/jadx" -d "reports/$base/source" "$apk"
            apkleaks -f "$apk" -o "reports/$base/apkleaks.txt"
            curl -fsS -F "file=@$apk" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/upload > "reports/$base/mobsf-upload.json"
            scan_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["hash"])' "reports/$base/mobsf-upload.json")"
            curl -fsS -X POST --data-urlencode "hash=$scan_hash" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/scan > "reports/$base/mobsf-scan.json"
            curl -fsS -X POST --data-urlencode "hash=$scan_hash" -H "Authorization: $MOBSF_API_KEY" http://127.0.0.1:8000/api/v1/report_json > "reports/$base/mobsf-report.json"
            mkdir -p "reports/$base/native"
            unzip -oq "$apk" 'lib/*/*.so' -d "reports/$base/native" || true
            while IFS= read -r native; do
              [ -n "$native" ] || continue
              name="$(basename "$native")"
              if command -v rabin2 >/dev/null 2>&1; then rabin2 -I "$native" > "reports/$base/$name.radare2.txt" 2>&1 || true; fi
              if [ -x "$GHIDRA_HOME/support/analyzeHeadless" ]; then
                "$GHIDRA_HOME/support/analyzeHeadless" "reports/$base/ghidra-project" "$name" -import "$native" -max-cpu 2 -analysisTimeoutPerFile 300 > "reports/$base/$name.ghidra.txt" 2>&1 || true
              fi
            done < <(find "reports/$base/native" -type f -name '*.so' -print)
            python - "$apk" "reports/$base/androguard.txt" <<'PY'
          import sys
          from androguard.misc import AnalyzeAPK
          a, ds, dx = AnalyzeAPK(sys.argv[1])
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write("Package: " + str(a.get_package()) + "\n")
              f.write("Permissions:\n" + "\n".join(a.get_permissions()) + "\n")
              f.write("Activities:\n" + "\n".join(a.get_activities()) + "\n")
          PY
          done < reports/apk-files.txt
      - name: Upload APK analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-apk-reports
          path: reports/
          if-no-files-found: warn
