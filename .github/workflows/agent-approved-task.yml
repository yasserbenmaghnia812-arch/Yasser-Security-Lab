name: Approved YSL Agent Tasks
run-name: YSL Agent / ${{ inputs.task_type }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      task_type:
        description: Predefined task to run
        required: true
        type: choice
        options:
          - api_tests
          - android_debug_apk
      approval_confirmed:
        description: Explicit approval from the authenticated app user
        required: true
        type: boolean
      request_id:
        description: API-generated correlation ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate approved task request
        env:
          TASK_TYPE: ${{ inputs.task_type }}
          APPROVED: ${{ inputs.approval_confirmed }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          test "$APPROVED" = "true"
          case "$TASK_TYPE" in
            api_tests|android_debug_apk) ;;
            *) echo "Task type is not allowlisted."; exit 1 ;;
          esac
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]]

  api-tests:
    if: inputs.task_type == 'api_tests' && inputs.approval_confirmed
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Run API test suite
        working-directory: api
        run: pytest -q

  android-debug-apk:
    if: inputs.task_type == 'android_debug_apk' && inputs.approval_confirmed
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Build Android Debug APK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yasser-security-lab-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
