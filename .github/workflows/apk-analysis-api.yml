name: Authorized APK Reverse Engineering
run-name: API job ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase analysis job identifier
        required: true
        type: string
      download_url:
        description: Short-lived private APK download URL generated by the API
        required: true
        type: string
      file_name:
        description: Uploaded APK filename
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare analysis workspace
        run: mkdir -p input reports
      - name: Download authorized APK
        env:
          APK_URL: ${{ inputs.download_url }}
          APK_NAME: ${{ inputs.file_name }}
        run: |
          curl --fail --location --retry 3 --max-time 300 "$APK_URL" -o "input/$APK_NAME"
          test -s "input/$APK_NAME"
          unzip -t "input/$APK_NAME"
          sha256sum "input/$APK_NAME" | tee reports/sha256.txt
      - name: Install Java and APK analysis tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Apktool and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip curl
          mkdir -p "$HOME/tools/jadx"
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/skylot/jadx/releases/latest", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          asset = next((a for a in release["assets"] if a["name"].endswith(".zip") and a["name"].startswith("jadx-")), None)
          if not asset:
              raise SystemExit("JADX release ZIP not found")
          urllib.request.urlretrieve(asset["browser_download_url"], "/tmp/jadx.zip")
          PY
          unzip -q /tmp/jadx.zip -d "$HOME/tools/jadx"
      - name: Run Apktool and JADX
        env:
          APK_NAME: ${{ inputs.file_name }}
        run: |
          apktool d -f "input/$APK_NAME" -o reports/apktool
          "$HOME/tools/jadx/bin/jadx" --show-bad-code -d reports/jadx "input/$APK_NAME"
          apkanalyzer manifest print "input/$APK_NAME" > reports/manifest.xml || true
      - name: Start MobSF API-only scanner
        run: |
          key="$(openssl rand -hex 32)"
          echo "MOBSF_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" -e MOBSF_API_ONLY=1 opensecurity/mobile-security-framework-mobsf:latest
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Authorization: $key" http://127.0.0.1:8000/api/v1/scans -o /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs mobsf
          exit 1
      - name: Run MobSF static analysis
        env:
          APK_NAME: ${{ inputs.file_name }}
        run: |
          curl --fail -F "file=@input/$APK_NAME" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/upload -o reports/mobsf-upload.json
          hash="$(python -c 'import json; print(json.load(open("reports/mobsf-upload.json"))["hash"])')"
          curl --fail -X POST --data-urlencode "hash=$hash" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/scan -o reports/mobsf-scan.json
          curl --fail -X POST --data-urlencode "hash=$hash" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/report_json -o reports/mobsf-report.json
      - name: Summarize analysis outputs
        if: always()
        run: |
          {
            echo "# APK analysis"
            echo
            echo "- Job: ${{ inputs.job_id }}"
            echo "- File: ${{ inputs.file_name }}"
            echo "- Apktool: $([ -d reports/apktool ] && echo completed || echo unavailable)"
            echo "- JADX: $([ -d reports/jadx ] && echo completed || echo unavailable)"
            echo "- MobSF: $([ -s reports/mobsf-report.json ] && echo completed || echo failed)"
          } > reports/SUMMARY.md
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yasser-apk-analysis-${{ inputs.job_id }}
          path: reports/
          if-no-files-found: warn
