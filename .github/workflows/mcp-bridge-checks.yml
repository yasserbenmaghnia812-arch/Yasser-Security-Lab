name: Replicate MCP Bridge Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp-bridge/**'
      - '.github/workflows/mcp-bridge-checks.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-bridge/**'
      - '.github/workflows/mcp-bridge-checks.yml'

permissions:
  contents: read

jobs:
  bridge-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-bridge/package.json
      - name: Install pinned bridge dependencies
        working-directory: mcp-bridge
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check bridge JavaScript syntax
        working-directory: mcp-bridge
        run: node --check server.mjs
      - name: Verify required package versions
        working-directory: mcp-bridge
        run: npm ls @modelcontextprotocol/sdk
