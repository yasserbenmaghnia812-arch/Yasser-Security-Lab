name: APK Analyzer Integration Test
run-name: Analyze the YSL debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk-self-test.yml'
permissions:
  contents: read
jobs:
  analyze-built-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Build the YSL APK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleDebug
          mkdir -p reports
          cp app/build/outputs/apk/debug/app-debug.apk reports/yasser-security-lab.apk
          sha256sum reports/yasser-security-lab.apk > reports/sha256.txt
      - name: Install Apktool and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip curl
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/skylot/jadx/releases/latest", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)
          asset = next((a for a in release["assets"] if a["name"].startswith("jadx-") and a["name"].endswith(".zip")), None)
          if not asset:
              raise SystemExit("JADX release ZIP not found")
          urllib.request.urlretrieve(asset["browser_download_url"], "/tmp/jadx.zip")
          PY
          mkdir -p "$HOME/tools/jadx"
          unzip -q /tmp/jadx.zip -d "$HOME/tools/jadx"
      - name: Run Apktool and JADX
        shell: bash
        run: |
          set +e
          mkdir -p reports/apktool reports/jadx
          apktool --version > reports/apktool-version.txt 2>&1
          APKTOOL_VERSION_STATUS=$?
          apktool d -f reports/yasser-security-lab.apk -o reports/apktool > reports/apktool.log 2>&1
          APKTOOL_STATUS=$?
          JADX_BIN="$(find "$HOME/tools/jadx" -maxdepth 4 -type f -name jadx -print -quit)"
          if [ -z "$JADX_BIN" ]; then
            echo "JADX executable was not found after installation." > reports/jadx.log
            JADX_STATUS=127
          else
            chmod +x "$JADX_BIN"
            "$JADX_BIN" --show-bad-code -d reports/jadx reports/yasser-security-lab.apk > reports/jadx.log 2>&1
            JADX_STATUS=$?
          fi
          APKTOOL_FILES="$(find reports/apktool -type f 2>/dev/null | wc -l)"
          JADX_SOURCES="$(find reports/jadx -type f -name '*.java' 2>/dev/null | wc -l)"
          {
            echo "Apktool exit: $APKTOOL_STATUS"
            echo "Apktool output files: $APKTOOL_FILES"
            echo "JADX exit: $JADX_STATUS"
            echo "JADX Java source files: $JADX_SOURCES"
            if [ "$JADX_STATUS" -eq 0 ]; then
              echo "JADX result: success"
            elif [ "$JADX_SOURCES" -gt 0 ]; then
              echo "JADX result: partial (review jadx.log; some classes failed to decompile)"
            else
              echo "JADX result: failed"
            fi
          } | tee reports/decompiler-status.txt
          # Keep the workflow moving so MobSF can still run. The final summary
          # distinguishes a clean, partial, and failed decompilation result.
      - name: Start MobSF static analyzer
        run: |
          key="$(openssl rand -hex 32)"
          echo "MOBSF_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" -e MOBSF_API_ONLY=1 opensecurity/mobile-security-framework-mobsf:latest
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Authorization: $key" http://127.0.0.1:8000/api/v1/scans -o /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs mobsf
          exit 1
      - name: Run MobSF static analysis
        run: |
          curl --fail -F "file=@reports/yasser-security-lab.apk" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/upload -o reports/mobsf-upload.json
          hash="$(python -c 'import json; print(json.load(open("reports/mobsf-upload.json"))["hash"])')"
          curl --fail -X POST --data-urlencode "hash=$hash" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/scan -o reports/mobsf-scan.json
          curl --fail -X POST --data-urlencode "hash=$hash" -H "Authorization: $MOBSF_KEY" http://127.0.0.1:8000/api/v1/report_json -o reports/mobsf-report.json
      - name: Validate and summarize APK analysis
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("reports")
          status_file = root / "decompiler-status.txt"
          status_text = status_file.read_text(errors="replace") if status_file.exists() else ""
          def number(label):
              match = re.search(rf"^{re.escape(label)}:\\s*(\\d+)", status_text, re.M)
              return int(match.group(1)) if match else 127

          apktool_exit = number("Apktool exit")
          apktool_files = number("Apktool output files")
          jadx_exit = number("JADX exit")
          jadx_sources = number("JADX Java source files")
          report_path = root / "mobsf-report.json"
          report = json.loads(report_path.read_text()) if report_path.exists() else None

          lines = [
              "# APK analysis summary",
              "",
              f"- APK SHA-256: {(root / 'sha256.txt').read_text().strip() if (root / 'sha256.txt').exists() else 'unavailable'}",
              f"- Apktool: exit {apktool_exit}; extracted files {apktool_files}",
              f"- JADX: exit {jadx_exit}; Java source files {jadx_sources}",
          ]
          if report:
              lines.extend([
                  f"- MobSF: report generated; version {report.get('version', 'unknown')}",
                  f"- Application: {report.get('app_name', 'unknown')} ({report.get('package_name', 'unknown')})",
                  f"- Android SDK: min {report.get('min_sdk', 'unknown')}; target {report.get('target_sdk', 'unknown')}",
              ])
              for section, summary_key in [
                  ("manifest_analysis", "manifest_summary"),
                  ("code_analysis", "summary"),
                  ("certificate_analysis", "certificate_summary"),
                  ("network_security", "network_summary"),
              ]:
                  summary = report.get(section, {}).get(summary_key, {})
                  if summary:
                      lines.append(f"- {section}: " + ", ".join(f"{key}={value}" for key, value in summary.items()))
          else:
              lines.append("- MobSF: report missing")
          (root / "SUMMARY.md").write_text("\\n".join(lines) + "\\n")
          print((root / "SUMMARY.md").read_text())

          if apktool_exit != 0 or apktool_files <= 0:
              raise SystemExit("APK analysis failed: Apktool did not produce decoded files.")
          if jadx_sources <= 0:
              raise SystemExit("APK analysis failed: JADX produced no Java source files.")
          if not report:
              raise SystemExit("APK analysis failed: MobSF JSON report is missing or invalid.")
          PY
      - name: Upload APK and scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ysl-apk-integration-test-reports
          path: reports/
          if-no-files-found: warn
