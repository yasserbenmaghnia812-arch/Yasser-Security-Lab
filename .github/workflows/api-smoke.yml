name: Yasser Security Lab API smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check public API health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            https://yasser-security-lab-api-7w2p.onrender.com/health -o health.json
          python -c "import json; d=json.load(open('health.json')); assert d.get('status') == 'ok', d"
      - name: Verify authenticated agent and Replica routes
        run: |
          set -euo pipefail
          for path in /v1/replica/tools /v1/agent/plan; do
            code="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              "https://yasser-security-lab-api-7w2p.onrender.com$path")"
            test "$code" = "401"
          done

# Re-run smoke checks after the API deployment containing the Replica routes.
