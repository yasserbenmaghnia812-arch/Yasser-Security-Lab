services:
  - type: web
    name: yasser-security-lab-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        value: https://jokemrlulcvoiahfnagz.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_2mydKfQGvTbpzop2JJs_Jw_gnTr2JZK
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_AUDIENCE
        value: authenticated
      - key: ALLOWED_ORIGINS
        value: https://yasser-security-lab.vercel.app
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: yasserbenmaghnia812-arch/Yasser-Security-Lab
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: cohere/north-mini-code:free
      - key: OPENROUTER_FALLBACK_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: REPLICA_MCP_URL
        value: https://replica-mcp-server-dfj0.onrender.com/mcp
      - key: REPLICA_MCP_BEARER_TOKEN
        sync: false
      - key: AGENT_WORKFLOW_REF
        value: main
